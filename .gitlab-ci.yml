
image: docker:latest

stages:
  - check
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# Frontend checks
frontend-check:
  stage: check
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/
#  artifacts:
#    paths:
#      - frontend/dist/
#    expire_in: 1 hour
  only:
    - merge_requests
    - master
    - main


# Frontend checks
frontend-edge-check:
  stage: check
  image: node:20-alpine
  before_script:
    - cd frontend_edge
    - npm ci
  script:
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/
  #  artifacts:
  #    paths:
  #      - frontend/dist/
  #    expire_in: 1 hour
  only:
    - merge_requests
    - master
    - main

# All-Rust checks
rust-check:
  stage: check
  image: rust:1.90.0
  before_script:
    - mkdir -p /builds/neiam/cooperative-systems-spaces/edge/../frontend_edge/dist
    - apt-get update && apt-get install -y libpq-dev cmake build-essential
  script:
    # Scoped to the crates this pipeline actually ships, not `--all`.
    #
    # This workspace has contained bevy since c651930 ("ToolGuard Workflows
    # and Various Kiosks"), so `cargo test --all` compiles a game engine,
    # gltf parsers and the two toolguard UIs before it will let a web server
    # image be built. Locally that is a 14GB target directory. On a runner it
    # is a disk-and-time gamble gating `build-docker`, and losing the gamble
    # means no image — which is how r.g.gmp.io/...:latest ended up months
    # stale while master moved on past it.
    #
    # The Dockerfile below builds `--package css-server --package css-cli`
    # and says so explicitly ("skip edge components in dockerfile"). css_lib
    # is a dependency of both and compiles either way, so its tests are free.
    # css-edge is kept because it is small, has no bevy in its tree, and is
    # what the frontend_edge/dist mkdir above exists for — it is built by
    # Dockerfile.edge in the GitHub pipeline.
    #
    # kiosk, toolguard-test-ui and toolguard-status-ui are in neither
    # Dockerfile. Add a crate back the day an image starts shipping it.
    - cargo test -p css-server -p css-cli -p css_lib -p css-edge
    # Uncomment when ready:
    # - cargo fmt --all -- --check
    # - cargo clippy --all-targets --all-features -- -D warnings
  cache:
    key: ${CI_COMMIT_REF_SLUG}-all
    paths:
      - target/
      - $CARGO_HOME/registry/
      - $CARGO_HOME/git/
  only:
    - merge_requests
    - master
    - main

